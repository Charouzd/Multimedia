<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <link rel="icon" type="image/png" href="media/img/logo.png">
        <title>PONIG PONG</title>
        <script src="https://kit.fontawesome.com/4e7b80b1e6.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    </head>
    <body>
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.min.js"></script>

        <main style="min-height:100vh;width:100%;display:flex;justify-content:center;align-items:center;flex-direction:column">
            <h1 style="text-decoration:underline;margin:1rem">Multimedia 2025/26 ->PONIG PONG</h1>
            
            <form style="width:75%; margin: 2rem" id='userForm'>
                <div style="margin: 2rem 0;" class="form-group">
                    <div style="display: flex;"><label style="margin-right: 3rem;" for="AI"><h3>Hra proti AI</h3></label>
                    <input style="width: 2rem;" class="form-control" type="checkbox" id="AI" name="AI"></div>
                    <label><h3>Schopnosti AI protivníka</h3></label>
                    <div style="display: flex;"><h6>Lenochod</h6> <input style="margin: 0 2rem;" type="range" name="AIspeed" step="0.001" value="0.05" min="0.009"  max="0.09" class="form-control-range" id="AIspeed"> <h6>Neporazitelný král pongu</h6></div>
                </div>
                <div class="form-group">
                    <label for="cap"><h3>Na kolik vítězných bodů se bude hrát</h3></label>
                    <div style="display: flex; justify-content:center;align-items:baseline"><h6>1</h6> <input style="margin: 0 2rem;" type="range" class="form-control-range" id="cap" name="cap" min="1" max="13" step="1" value="13"> <h6>13</h6></div>
                </div>

                <div class="form-group">
                    <label><h3>Pálka Hráče č.1</h3></label>
                    <select id="P1" name="P1" class="form-control" data-default="fire"></select>
                </div>
                <div class="form-group">
                    <label><h3>Pálka Hráče č.2</h3></label>
                    <select id="P2" name="P2" class="form-control" data-default="ice"></select>
                </div>
                <div class="form-group">
                    <label><h3>Míček</h3></label>
                    <select id="Ball" name="Ball" class="form-control" data-default="melone"></select>
                </div>
                <div class="form-group">
                    <label><h3>Sada zvuků</h3></label>
                    <select id="SoundPack" name="SoundPack" class="form-control"></select>
                </div>

                <p>
                    <input class="btn btn-primary mb-2" type="submit" name="submit" id="sub" value="Začít hrát">
                    <button class="btn btn-warning mb-2" type="button" data-toggle="collapse" data-target="#collapseWidthExample">Ovládání</button>
                </p>
            </form>

            <div style="min-height: 120px; width: 33%;">
                <div class="collapse" style="width: 100%;" id="collapseWidthExample">
                  <div class="card card-body" style="width: 100%; text-align:center" >
                    <span class="text-success" >Hráč 1(zelený)</span> -> Levá strana<br>
                    <span class="text-danger">Hráč 2(červený)</span> -> Pravá strana<br>
                    <h4>Ovládání:</h4>
                    </div>
                </div>
            </div>

<script>
    // --- 1. FUNKCE PRO GENEROVÁNÍ OPTIONŮ ---
    // Nyní přijímá navíc parametr 'subfolder', aby věděla, do jaké podsložky sáhnout
    function generujMoznosti(elementId, seznamSouboru, subfolder, defaultVal) {
        const select = document.getElementById(elementId);
        if (!select) {
            console.error(`Element s ID '${elementId}' nenalezen.`);
            return;
        }
        select.innerHTML = ""; // Vyčistit seznam

        if (!seznamSouboru || seznamSouboru.length === 0) {
            console.warn(`Pro element '${elementId}' nebyl dodán žádný seznam souborů.`);
            const option = document.createElement("option");
            option.text = "Žádné soubory";
            select.appendChild(option);
            return;
        }

        seznamSouboru.forEach(soubor => {
            // Získání názvu bez přípony pro zobrazení v menu
            const jmeno = soubor.split('.').slice(0, -1).join('.'); 
            const option = document.createElement("option");
            
            // DŮLEŽITÉ: Cesta nyní zahrnuje podsložku (pads/ nebo ball/)
            option.value = `media/img/${subfolder}/${soubor}`;
            
            // Převedení prvního písmene na velké pro hezčí vzhled
            option.text = jmeno.charAt(0).toUpperCase() + jmeno.slice(1);
            
            // Nastavení výchozí hodnoty, pokud odpovídá názvu souboru (bez přípony)
            if (jmeno.toLowerCase() === defaultVal.toLowerCase()) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    }

    // --- 2. FUNKCE PRO ZVUKY (beze změny) ---
    function generujZvuky(elementId, dataZvuku) {
        console.log("Spouštím generování zvuků...");
        const select = document.getElementById(elementId);
        
        if (!select) {
            console.error(`CHYBA: Element s ID '${elementId}' nebyl v HTML nalezen!`);
            return;
        }
        select.innerHTML = "";
        
        const kategorie = Object.keys(dataZvuku);
        console.log("Nalezené kategorie zvuků:", kategorie);

        if (kategorie.length === 0) {
            const option = document.createElement("option");
            option.text = "Žádné zvuky nenalezeny";
            select.appendChild(option);
            return;
        }

        kategorie.forEach((nazev, index) => {
            const option = document.createElement("option");
            option.value = nazev; 
            option.text = nazev;
            if (index === 0) option.selected = true;
            select.appendChild(option);
        });
        console.log("Menu zvuků úspěšně naplněno.");
    }

    // --- HLAVNÍ LOGIKA: NAČTENÍ DAT ---

    // A) Načtení seznamu obrázků (manifest.json)
    fetch('manifest.json')
        .then(response => {
            if (!response.ok) {
                throw new Error("Nepodařilo se načíst manifest.json. Spusťte nejprve generovací skript.");
            }
            return response.json(); // Převedeme přímo na JSON objekt
        })
        .then(data => {
            // data.pads obsahuje pole souborů z složky 'pads'
            // data.balls obsahuje pole souborů z složky 'ball'
            
            // Generování možností pro Pálku 1 (bere z 'pads')
            generujMoznosti("P1", data.pads, "pads", "fire");
            // Generování možností pro Pálku 2 (bere z 'pads')
            generujMoznosti("P2", data.pads, "pads", "ice");
            // Generování možností pro Míček (bere z 'balls')
            generujMoznosti("Ball", data.balls, "ball", "melone");
        })
        .catch(error => {
            console.error("Chyba při načítání manifestu:", error);
            // Vytvoříme nouzové prázdné optiony, aby formulář nebyl úplně rozbitý
             ["P1", "P2", "Ball"].forEach(id => {
                 const sel = document.getElementById(id);
                 if(sel) sel.innerHTML = "<option>Chyba načtení dat</option>";
             });
            alert("Chyba: Nepodařilo se načíst seznam obrázků (manifest.json).\n\nUjistěte se, že jste spustili 'generate_manifest.ps1' a že spouštíte stránku přes lokální server.");
        });

    // B) Načtení zvuků (sounds.json) -> volá generujZvuky (beze změny)
    fetch('sounds.json')
        .then(res => {
             if (!res.ok) throw new Error("sounds.json nenalezen");
             return res.json();
        })
        .then(data => {
            generujZvuky("SoundPack", data);
        })
        .catch(err => {
            console.error("Chyba sounds.json:", err);
             const sel = document.getElementById("SoundPack");
             if(sel) sel.innerHTML = "<option>Chyba načtení zvuků</option>";
        });

        
    // Obsluha odeslání formuláře
    document.getElementById('userForm').addEventListener('submit', function(event) {
        event.preventDefault(); 
        const formData = new FormData(document.getElementById('userForm'));
        const queryString = new URLSearchParams(formData).toString();
        window.location.href = `game.html?${queryString}`;
    });
</script>
        </main>
    </body>
</html>
